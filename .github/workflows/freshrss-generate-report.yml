name: Generate Daily Report from FreshRSS JSON

on:
  workflow_dispatch: # 手动触发，便于调试
    inputs:
      enable_ssh_debug:
        description: '启用 SSH 调试 (true/false)'
        required: false
        default: 'false'
        type: string
      ssh_timeout:
        description: 'SSH 调试超时时间 (分钟)'
        required: false
        default: '30'
        type: string

jobs:
  generate-report:
    runs-on: ubuntu-latest

    env:
      ENABLE_TOOL_SEARCH: false
      ANTHROPIC_BASE_URL: https://api.kimi.com/coding/
      ANTHROPIC_API_KEY: ${{ secrets.KIMI_API_KEY }}

    steps:
      # 1. 拉取当前仓库代码
      - name: Checkout Source Repository
        uses: actions/checkout@v4

      # 2. 检查 JSON 文件是否存在
      - name: Check JSON files exist
        run: |
          if [ ! -d "tech-daily" ] || [ -z "$(ls -A tech-daily/*.json 2>/dev/null)" ]; then
            echo "❌ 错误: tech-daily/ 目录不存在或没有 JSON 文件"
            echo "请先运行 freshrss-sync.yml 导出 JSON 数据，或手动放置 JSON 文件"
            exit 1
          fi
          echo "✅ 找到 JSON 文件:"
          ls -la tech-daily/*.json

      # 3. 设置 Node.js 环境
      - name: Setup Node.js 24.3.0
        uses: actions/setup-node@v4
        with:
          node-version: '24.3.0'

      # 4. 安装 Claude Code
      - name: Install claude-code and Initialize Config
        run: |
          echo "=== 开始安装和配置 Claude Code ==="

          # 检查版本确认是否切换成功
          echo "Node.js 版本:"
          node -v

          # 全局安装 claude-code
          echo "正在安装 claude-code..."
          npm install -g @anthropic-ai/claude-code --registry=https://registry.npmmirror.com

          # 检查安装结果
          echo "Claude Code 安装路径:"
          which claude || echo "未找到 claude 命令"

          echo "Claude Code 版本:"
          claude --version 2>/dev/null || echo "无法获取版本"

          # 初始化配置
          echo "初始化 Claude Code 配置..."
          node --eval "
            const fs = require('fs');
            const os = require('os');
            const path = require('path');

            const homeDir = os.homedir();
            const filePath = path.join(homeDir, '.claude.json');

            console.log('配置目录:', homeDir);
            console.log('配置文件路径:', filePath);

            if (fs.existsSync(filePath)) {
                console.log('配置文件已存在，读取中...');
                const content = JSON.parse(fs.readFileSync(filePath, 'utf-8'));
                console.log('原配置内容:', JSON.stringify(content, null, 2));

                const newContent = { ...content, hasCompletedOnboarding: true };
                fs.writeFileSync(filePath, JSON.stringify(newContent, null, 2), 'utf-8');
                console.log('配置已更新');
                console.log('新配置内容:', JSON.stringify(newContent, null, 2));
            } else {
                console.log('配置文件不存在，创建新配置...');
                const newContent = { hasCompletedOnboarding: true };
                fs.writeFileSync(filePath, JSON.stringify(newContent, null, 2), 'utf-8');
                console.log('配置已创建:', JSON.stringify(newContent, null, 2));
            }

            // 验证文件写入
            if (fs.existsSync(filePath)) {
                const verifyContent = fs.readFileSync(filePath, 'utf-8');
                console.log('配置文件验证成功:');
                console.log(verifyContent);
            } else {
                console.log('错误: 配置文件写入失败!');
            }
          "

          echo "=== Claude Code 安装和配置完成 ==="

      # 5. SSH 调试（可选）
      - name: Setup SSH Debug Session
        if: ${{ github.event.inputs.enable_ssh_debug == 'true' }}
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: ${{ fromJson(github.event.inputs.ssh_timeout) }}
        with:
          limit-access-to-actor: true
        env:
          ENABLE_TOOL_SEARCH: false
          ANTHROPIC_BASE_URL: https://api.kimi.com/coding/
          ANTHROPIC_API_KEY: ${{ secrets.KIMI_API_KEY }}

      # 6. 显示调试信息
      - name: Display Debug Info
        run: |
          echo "=== 调试信息 ==="
          echo "当前目录: $(pwd)"
          echo "目录内容:"
          ls -la
          echo ""
          echo "tech-daily 目录内容:"
          ls -la tech-daily/ 2>/dev/null || echo "tech-daily 目录不存在"
          echo ""
          echo "Claude Code 配置:"
          cat ~/.claude.json 2>/dev/null || echo "配置文件不存在"
          echo ""
          echo "环境变量:"
          echo "ENABLE_TOOL_SEARCH: $ENABLE_TOOL_SEARCH"
          echo "ANTHROPIC_BASE_URL: $ANTHROPIC_BASE_URL"
          echo "ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:0:10}..."
          echo ""
          echo "=== 调试信息结束 ==="

      # 7. 运行 Claude Code 生成日报
      - name: Run Claude Code
        run: |
          # 执行具体的 Claude 指令
          claude -p "阅读tech_daily.md并执行对应任务"

      # 8. 统一提交所有变更
      - name: Commit All Changes
        run: |
          # 配置 Git 机器人账号信息
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 添加所有变更（Claude 生成的日报）
          git add .

          # 检查是否有文件变更
          if git diff --staged --quiet; then
            echo "没有新的数据变更，无需提交。"
          else
            git commit -m "Auto-generate daily report: $(date +'%Y-%m-%d %H:%M')"
            git push origin main
            echo "✅ 成功推送到当前仓库！"
          fi
