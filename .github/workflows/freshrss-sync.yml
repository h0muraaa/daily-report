name: Auto Export FreshRSS and Generate Daily Report

on:
  schedule:
    # 定时任务：每天北京时间凌晨2点执行（UTC时间18点）
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - json-only
          - report-only

permissions:
  contents: write

jobs:
  export-and-sync:
    runs-on: ubuntu-latest

    env:
      ENABLE_TOOL_SEARCH: false
      ANTHROPIC_BASE_URL: https://opencode.ai/zen/go
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODEL: deepseek-v4.1-flash

    steps:
      - name: Checkout Source Repository
        uses: actions/checkout@v4

      # 2. 导出 FreshRSS 数据
      - name: Set up Python
        if: ${{ github.event.inputs.mode != 'report-only' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run FreshRSS Script
        if: ${{ github.event.inputs.mode != 'report-only' }}
        env:
          FRESHRSS_USERNAME: ${{ secrets.FRESHRSS_USERNAME }}
          FRESHRSS_PASSWORD: ${{ secrets.FRESHRSS_PASSWORD }}
        run: |
          echo "清理 tech-daily 目录下的旧 JSON 文件..."
          mkdir -p tech-daily
          rm -f tech-daily/*.json
          
          echo "开始执行 FreshRSS 抓取脚本并导出到 tech-daily..."
          cd freshrss
          python freshrss_export_batch.py -o ../tech-daily/

      # 3. 检查 JSON 文件
      - name: Check JSON files exist
        run: |
          if [ ! -d "tech-daily" ] || [ -z "$(ls -A tech-daily/*.json 2>/dev/null)" ]; then
            echo "❌ 错误: tech-daily/ 目录没有 JSON 文件"
            if [ "${{ github.event.inputs.mode }}" == "report-only" ]; then exit 1; fi
          else
            echo "✅ 找到 JSON 文件:"
            ls -la tech-daily/*.json
          fi

      # 4. 生成日报
      - name: Setup Node.js 24.3.0
        if: ${{ github.event.inputs.mode != 'json-only' }}
        uses: actions/setup-node@v4
        with:
          node-version: '24.3.0'

      - name: Install claude-code and Initialize Config
        if: ${{ github.event.inputs.mode != 'json-only' }}
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.150 --registry=https://registry.npmjs.org --ignore-scripts=false --foreground-scripts --include=optional
          node --eval "
            const fs = require('fs');
            const os = require('os');
            const path = require('path');
            const homeDir = os.homedir();
            const filePath = path.join(homeDir, '.claude.json');
            if (fs.existsSync(filePath)) {
                const content = JSON.parse(fs.readFileSync(filePath, 'utf-8'));
                fs.writeFileSync(filePath, JSON.stringify({ ...content, hasCompletedOnboarding: true }, null, 2), 'utf-8');
            } else {
                fs.writeFileSync(filePath, JSON.stringify({ hasCompletedOnboarding: true }), 'utf-8');
            }
          "

      - name: Generate Daily Reports with Claude
        if: ${{ github.event.inputs.mode != 'json-only' }}
        timeout-minutes: 15
        run: |
          JSON_FILE=$(ls -t ./tech-daily/*.json | head -1)
          echo "📄 使用 JSON 文件: $JSON_FILE"

          ROLES="cto_insight developer_practice tech_enthusiast investment_analysis academic_research user_research"

          # 先全部生成到暂存目录，六个角色齐了才覆盖线上页面。
          # 旧做法是先在原地删掉角色页再生成：2026-11-04 上游模型 402 欠费、六次调用全失败，
          # 被删掉的页面随后被 `git add .` 一起提交，首页六个角色入口全部 404。
          STAGE="tech-daily/.staging"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          trap 'rm -rf "$STAGE"' EXIT

          echo "🚀 并行启动 6 个角色的日报生成..."
          for ROLE in $ROLES; do
            echo "  -> 启动 $ROLE"
            claude -p --dangerously-skip-permissions "使用 tech-daily-generator Skill 读取文件 $JSON_FILE，生成 --role $ROLE 的科技日报，输出到 ./${STAGE}/ 目录" &
          done

          echo "⏳ 等待所有任务完成..."
          wait || true

          echo "📂 检查生成的文件："
          ls -la "$STAGE"/*.html || true

          MISSING=""
          for ROLE in $ROLES; do
            if [ -f "$STAGE/${ROLE}.html" ]; then
              echo "✅ ${ROLE}.html"
            else
              echo "⚠️ 缺少: ${STAGE}/${ROLE}.html"
              MISSING="$MISSING $ROLE"
            fi
          done

          if [ -n "$MISSING" ]; then
            echo "❌ 生成失败的角色:$MISSING"
            echo "保留上一版页面不动，不发布残缺日报（避免首页 404 / 日期混排）"
            exit 1
          fi

          for ROLE in $ROLES; do
            mv "$STAGE/${ROLE}.html" "./tech-daily/${ROLE}.html"
          done

          echo "✅ 6 个角色的日报全部生成成功"

      # 5. 归档当天日报，供主页历史回溯（按日期名清理，保留最近 15 天）
      - name: Archive Daily Reports
        if: ${{ github.event.inputs.mode != 'json-only' && success() }}
        run: python3 scripts/tech_daily_archive.py save --keep 15

      # 6. 提交变更（生成失败时不提交，避免把删除半套页面的改动推上线）
      - name: Commit All Changes
        if: ${{ success() }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          REPORT_EXISTS=$(ls tech-daily/*.html 2>/dev/null || echo "")
          if [ -n "$REPORT_EXISTS" ]; then
            echo "✅ 检测到新生成的报告文件"
          fi

          git add .

          if git diff --staged --quiet; then
            echo "没有新的数据变更，无需提交。"
          else
            MSG="Auto-sync: $(date +'%Y-%m-%d %H:%M')"
            if [ "${{ github.event.inputs.mode }}" == "json-only" ]; then MSG="Export JSON: $(date +'%Y-%m-%d %H:%M')"; fi
            
            git commit -m "$MSG"
            git push origin main
            echo "✅ 成功推送到当前仓库！"
          fi
