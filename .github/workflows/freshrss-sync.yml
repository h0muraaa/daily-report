name: Auto Export FreshRSS and Generate Daily Report

on:
  schedule:
    # 定时任务：每天北京时间凌晨2点执行（UTC时间18点）
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - json-only
          - report-only

permissions:
  contents: write

jobs:
  export-and-sync:
    runs-on: ubuntu-latest

    env:
      ENABLE_TOOL_SEARCH: false
      ANTHROPIC_BASE_URL: https://api.kimi.com/coding/
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - name: Checkout Source Repository
        uses: actions/checkout@v4

      # 2. 导出 FreshRSS 数据
      - name: Set up Python
        if: ${{ github.event.inputs.mode != 'report-only' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run FreshRSS Script
        if: ${{ github.event.inputs.mode != 'report-only' }}
        env:
          FRESHRSS_USERNAME: ${{ secrets.FRESHRSS_USERNAME }}
          FRESHRSS_PASSWORD: ${{ secrets.FRESHRSS_PASSWORD }}
        run: |
          echo "清理 tech-daily 目录下的旧 JSON 文件..."
          mkdir -p tech-daily
          rm -f tech-daily/*.json
          
          echo "开始执行 FreshRSS 抓取脚本并导出到 tech-daily..."
          cd freshrss
          python freshrss_export_batch.py -o ../tech-daily/

      # 3. 检查 JSON 文件
      - name: Check JSON files exist
        run: |
          if [ ! -d "tech-daily" ] || [ -z "$(ls -A tech-daily/*.json 2>/dev/null)" ]; then
            echo "❌ 错误: tech-daily/ 目录没有 JSON 文件"
            if [ "${{ github.event.inputs.mode }}" == "report-only" ]; then exit 1; fi
          else
            echo "✅ 找到 JSON 文件:"
            ls -la tech-daily/*.json
          fi

      # 4. 生成日报
      - name: Setup Node.js 24.3.0
        if: ${{ github.event.inputs.mode != 'json-only' }}
        uses: actions/setup-node@v4
        with:
          node-version: '24.3.0'

      - name: Install claude-code and Initialize Config
        if: ${{ github.event.inputs.mode != 'json-only' }}
        run: |
          npm install -g @anthropic-ai/claude-code --registry=https://registry.npmmirror.com
          node --eval "
            const fs = require('fs');
            const os = require('os');
            const path = require('path');
            const homeDir = os.homedir();
            const filePath = path.join(homeDir, '.claude.json');
            if (fs.existsSync(filePath)) {
                const content = JSON.parse(fs.readFileSync(filePath, 'utf-8'));
                fs.writeFileSync(filePath, JSON.stringify({ ...content, hasCompletedOnboarding: true }, null, 2), 'utf-8');
            } else {
                fs.writeFileSync(filePath, JSON.stringify({ hasCompletedOnboarding: true }), 'utf-8');
            }
          "

      - name: Run Claude Code via Tmux
        if: ${{ github.event.inputs.mode != 'json-only' }}
        id: run_claude
        env:
          EXPECTED_HTML_COUNT: 6  # <--- 在此修改你期望的最低 HTML 文件生成数量
        run: |
          echo "安装 tmux..."
          sudo apt-get install -y tmux
          
          echo "启动 tmux 会话并启动 Claude..."
          tmux new-session -d -s claude_session
          tmux send-keys -t claude_session "claude --dangerously-skip-permissions" C-m
          
          # 等待 Claude 初始化完成（由于是后台运行，需要给足够的时间冷启动）
          sleep 10 
          
          echo "向 Claude 发送任务指令..."
          tmux send-keys -t claude_session "阅读tech_daily.md并执行对应任务" C-m
          
          echo "轮询检查是否生成了 ${EXPECTED_HTML_COUNT} 个 HTML 文件，限时 15 分钟..."
          ELAPSED=0
          TIMEOUT=900
          SUCCESS=false
          
          while [ $ELAPSED -lt $TIMEOUT ]; do
            CURRENT_COUNT=$(ls -1 *.html 2>/dev/null | wc -l)
            if [ "$CURRENT_COUNT" -ge "$EXPECTED_HTML_COUNT" ]; then
              echo "✅ 成功检测到 $CURRENT_COUNT 个 HTML 文件！"
              SUCCESS=true
              break
            fi
            sleep 10
            ELAPSED=$((ELAPSED+10))
          done
          
          # 记录运行结果供后续 tmate 步骤判断
          if [ "$SUCCESS" = true ]; then
            echo "html_generated=true" >> $GITHUB_OUTPUT
            # 正常生成后，关闭后台的 tmux 会话
            tmux kill-session -t claude_session || true
          else
            echo "❌ 未在规定时间内生成期望的 HTML 文件数量 (当前: $CURRENT_COUNT, 期望: $EXPECTED_HTML_COUNT)"
            echo "html_generated=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup tmate debug session
        if: ${{ github.event.inputs.mode != 'json-only' && steps.run_claude.outputs.html_generated == 'false' }}
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true
        timeout-minutes: 30

      - name: Fail workflow if generation failed
        if: ${{ github.event.inputs.mode != 'json-only' && steps.run_claude.outputs.html_generated == 'false' }}
        run: exit 1

      # 5. 提交变更
      - name: Commit All Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          REPORT_EXISTS=$(ls *.html 2>/dev/null || echo "")
          if [ -n "$REPORT_EXISTS" ]; then
            echo "✅ 检测到新生成的报告文件"
          fi

          git add .

          if git diff --staged --quiet; then
            echo "没有新的数据变更，无需提交。"
          else
            MSG="Auto-sync: $(date +'%Y-%m-%d %H:%M')"
            if [ "${{ github.event.inputs.mode }}" == "json-only" ]; then MSG="Export JSON: $(date +'%Y-%m-%d %H:%M')"; fi
            
            git commit -m "$MSG"
            git push origin main
            echo "✅ 成功推送到当前仓库！"
          fi
