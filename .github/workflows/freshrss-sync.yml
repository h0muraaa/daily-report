name: Auto Export FreshRSS and Generate Daily Report

on:
  schedule:
    # 定时任务：每天北京时间凌晨2点执行（UTC时间18点）
    - cron: '0 18 * * *'
  workflow_dispatch: # 允许网页端手动触发

jobs:
  export-and-sync:
    runs-on: ubuntu-latest

    env:
      ENABLE_TOOL_SEARCH: false
      ANTHROPIC_BASE_URL: https://api.kimi.com/coding/
      ANTHROPIC_API_KEY: ${{ secrets.KIMI_API_KEY }}

    steps:
      # 1. 拉取当前仓库代码
      - name: Checkout Source Repository
        uses: actions/checkout@v4

      # 2. 设置 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. 执行 FreshRSS 导出脚本
      - name: Run FreshRSS Script
        env:
          FRESHRSS_USERNAME: ${{ secrets.FRESHRSS_USERNAME }}
          FRESHRSS_PASSWORD: ${{ secrets.FRESHRSS_PASSWORD }}
        run: |
          echo "开始执行 FreshRSS 抓取脚本..."
          cd freshrss
          python freshrss_export_batch.py

      # 4. 复制 JSON 文件到目标目录
      - name: Copy JSON files
        run: |
          # 检查输出目录是否存在且有文件
          if [ ! -d "freshrss/output" ] || [ -z "$(ls -A freshrss/output/*.json 2>/dev/null)" ]; then
            echo "❌ 错误: freshrss/output/ 目录不存在或没有 JSON 文件"
            exit 1
          fi

          # 创建目标目录（如果不存在）
          mkdir -p tech-daily

          # 清理旧 JSON 文件
          echo "清理 tech-daily 目录下的旧 JSON 文件..."
          rm -f tech-daily/*.json

          # 复制新生成的 JSON 文件
          echo "将新的 JSON 数据复制到 tech-daily..."
          cp freshrss/output/*.json tech-daily/
          echo "✅ 复制完成"

      # 5. 设置 Node.js 环境
      - name: Setup Node.js 24.3.0
        uses: actions/setup-node@v4
        with:
          node-version: '24.3.0'

      # 6. 安装 Claude Code
      - name: Install claude-code and Initialize Config
        run: |
          # 检查版本确认是否切换成功
          node -v

          # 全局安装 claude-code
          npm install -g @anthropic-ai/claude-code --registry=https://registry.npmmirror.com

          # 初始化配置
          node --eval "
            const fs = require('fs');
            const os = require('os');
            const path = require('path');

            const homeDir = os.homedir();
            const filePath = path.join(homeDir, '.claude.json');

            if (fs.existsSync(filePath)) {
                const content = JSON.parse(fs.readFileSync(filePath, 'utf-8'));
                fs.writeFileSync(filePath, JSON.stringify({ ...content, hasCompletedOnboarding: true }, null, 2), 'utf-8');
            } else {
                fs.writeFileSync(filePath, JSON.stringify({ hasCompletedOnboarding: true }), 'utf-8');
            }
          "

      # 7. 运行 Claude Code 生成日报
      - name: Run Claude Code
        run: |
          # 执行具体的 Claude 指令
          claude -p "阅读tech_daily.md并执行对应任务"

      # 8. 统一提交所有变更
      - name: Commit All Changes
        run: |
          # 配置 Git 机器人账号信息
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 添加所有变更（JSON 文件 + Claude 生成的日报）
          git add .

          # 检查是否有文件变更
          if git diff --staged --quiet; then
            echo "没有新的数据变更，无需提交。"
          else
            git commit -m "Auto-sync FreshRSS data and generate daily report: $(date +'%Y-%m-%d %H:%M')"
            git push origin main
            echo "✅ 成功推送到当前仓库！"
          fi
