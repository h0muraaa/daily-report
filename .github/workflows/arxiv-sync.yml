name: Auto Generate arXiv Daily Report

permissions:
  contents: write

on:
  schedule:
    # 定时任务：每天北京时间早上 6 点执行（UTC时间前一天的22点）
    - cron: '0 22 * * *'
  workflow_dispatch: # 允许网页端手动触发

jobs:
  arxiv-daily-sync:
    runs-on: ubuntu-latest
    
    steps:
      # 1. 拉取当前仓库代码
      - name: Checkout Source Repository
        uses: actions/checkout@v4

      # 2. 设置 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. 安装依赖与工具 (采用 uv)
      - name: Install Dependencies
        run: |
          # 安装基础库和 uv
          python -m pip install --upgrade pip
          pip install Pillow uv
          
          # 采用 uv tool 独立安装 nlm cli（固定版本避免不兼容升级）
          uv tool install notebooklm-mcp-cli==0.10.0
          
          # 【关键】：uv tool 默认会将可执行文件安装在 ~/.local/bin，必须将其加入 Github Actions 的 PATH 中
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      # 4. 配置 NotebookLM CLI 登录凭证
      - name: Setup NotebookLM Auth
        env:
          COOKIES: ${{ secrets.COOKIES }}
          METADATA: ${{ secrets.METADATA }}
        run: |
          echo "配置 NotebookLM CLI 登录凭证..."
          mkdir -p ~/.notebooklm-mcp-cli/profiles/default
          echo "$COOKIES" > ~/.notebooklm-mcp-cli/profiles/default/cookies.json
          echo "$METADATA" > ~/.notebooklm-mcp-cli/profiles/default/metadata.json

      # 5. 执行核心流程：抓取RSS、生成图表与HTML、推送到当前仓库
      - name: Run arXiv Daily Generation & Push
        env:
          # 15 = generate_html_report.py 的显示条数上限，再多也展示不出来，
          # 却要多烧一次 NotebookLM 的 infographic 配额。曾用 20，把额度打满过。
          DEBUG_LIMIT: 15
          PROXY: ${{ secrets.PROXY }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p ./arxiv-daily-output/arxiv-daily/images
          python3 arxiv_codes/fetch_arxiv_rss.py

          echo "检查 NotebookLM 状态..."
          nlm login --check -p default || nlm login -p default

          echo "生成论文信息图表..."
          python3 arxiv_codes/process_arxiv_papers.py

          # papers_processed.json 只在真正处理过论文时才会写出来：今天没有新论文、
          # 或 infographic 全部提交失败（比如 NotebookLM 配额打满）时它都不存在。
          # 那种情况下 generate_html_report.py 必然报错、cp 也必然失败，
          # 会把整条流水线染红——但结论其实是「今天没有可发布的新内容」，不该算失败。
          if [ -f ./arxiv-daily-output/papers_processed.json ]; then
            echo "生成 HTML 网页..."
            python3 arxiv_codes/generate_html_report.py

            echo "同步生成结果至当前仓库..."
            mkdir -p arxiv-daily/images
            cp ./arxiv-daily-output/arxiv-daily/index.html arxiv-daily/
            cp ./arxiv-daily-output/arxiv-daily/images/*.jpg arxiv-daily/images/ 2>/dev/null || true
          else
            echo "ℹ️  没有处理任何论文（今天无新论文，或 infographic 未提交成功），跳过 HTML 生成与仓库同步。"
          fi

          echo "清理超过 7 天的旧图片..."
          python3 scripts/arxiv_prune_images.py --keep-days 7

          git add -A
          TODAY=$(date +%Y-%m-%d)

          if git diff --staged --quiet; then
            echo "没有新的数据变更，无需提交。"
          else
            git commit -m "arXiv Daily Report $TODAY"
            git push
            echo "✅ 成功推送日报到当前仓库！"
          fi
